<meta charset="utf-8">
<title>설정 패널 레이아웃 참조</title>
<style>
  :root {
    --parchment-top: #F3E6C6;
    --parchment-bottom: #E6D3AC;
    --parchment-edge: #C9AE7C;
    --ink: #4A3A22;
    --ink-soft: #7A6540;
    --track-outer: #5E2C29;
    --track-inner: #8A4038;
    --handle: #F5CE4A;
    --box-bg: #F8F0DA;
    --box-border: #B49468;
    --key-bg: #3E4654;
    --key-wait: #9AA0A8;
    --blue: #46A0DC;
    --blue-dark: #2F86C2;
    --khaki: #BFAE7E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }

  /* 1920x1080 기준. 화면 폭에 맞춰 통째로 축소된다. */
  .stage {
    position: relative;
    width: 1920px; height: 1080px;
    transform-origin: top left;
    overflow: hidden;
  }

  /* 오른쪽 게임 화면(참조용 근사) */
  .world { position: absolute; inset: 0; }
  .world .sky   { position: absolute; inset: 0 0 46% 0; background: linear-gradient(#7FA8C4, #A8C4D4); }
  .world .hills { position: absolute; left: 0; right: 0; top: 22%; height: 34%;
                  background: radial-gradient(60% 100% at 30% 100%, #4E6B4A, #3A5240 70%, #33463A); }
  .world .grass { position: absolute; left: 0; right: 0; top: 40%; height: 16%; background: #4C6B3F; }
  .world .water { position: absolute; left: 0; right: 0; top: 56%; height: 12%; background: #2C5A78; }
  .world .stone { position: absolute; left: 0; right: 0; top: 68%; bottom: 0; background: #6E6A62; }
  .world::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(3px); background: rgba(0,0,0,.18); }

  .hud-right { position: absolute; top: 24px; right: 32px; display: flex; gap: 16px; }
  .hud-right span {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(40,50,64,.55); border: 2px solid rgba(255,255,255,.25);
    color: #E8EEF4; font-size: 26px; display: grid; place-items: center;
  }

  /* 설정 패널 */
  .panel {
    position: absolute; left: 0; top: 0; width: 795px; height: 1080px;
    padding: 44px 56px 0 44px;
    background: linear-gradient(160deg, var(--parchment-top), var(--parchment-bottom));
    border-right: 6px solid var(--parchment-edge);
    /* 오른쪽 끝을 살짝 불규칙하게 잘라 양피지 느낌을 낸다 */
    clip-path: polygon(0 0, 98.2% 0, 99.4% 6%, 98.0% 13%, 99.6% 21%, 98.4% 29%,
                       99.8% 37%, 98.2% 45%, 99.5% 53%, 98.0% 61%, 99.6% 69%,
                       98.3% 77%, 99.7% 85%, 98.1% 93%, 99.4% 100%, 0 100%);
    color: var(--ink);
  }

  h1 { margin: 0 0 34px; font-size: 46px; letter-spacing: 2px; }
  h2 {
    margin: 0 0 22px; font-size: 32px; color: var(--ink-soft);
    padding-bottom: 8px; border-bottom: 2px solid rgba(122,101,64,.28);
  }
  section { margin-bottom: 46px; }

  .row { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
  .row .label { width: 150px; text-align: right; font-size: 26px; }

  /* 슬라이더 */
  .track {
    position: relative; width: 470px; height: 30px; border-radius: 15px;
    background: linear-gradient(var(--track-inner), var(--track-outer));
    border: 3px solid #4A211F; box-shadow: inset 0 3px 6px rgba(0,0,0,.45);
  }
  .track .handle {
    position: absolute; top: 50%; width: 22px; height: 22px;
    background: var(--handle); border: 2px solid #8A6A14;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .valuebox {
    width: 104px; height: 46px; display: grid; place-items: center;
    background: var(--box-bg); border: 3px solid var(--box-border); border-radius: 4px;
    font-size: 24px;
  }

  /* 키 설정 */
  .keybox {
    width: 152px; height: 46px; display: grid; place-items: center;
    background: var(--key-bg); color: #fff; border-radius: 4px;
    border: 3px solid #2A303B; font-size: 24px;
  }
  .keybox.waiting { background: var(--key-wait); border-color: #78808A; font-size: 21px; }
  .waiticon { width: 26px; height: 26px; color: var(--blue); font-size: 22px; }

  button {
    font: inherit; color: #fff; border: none; border-radius: 6px; cursor: pointer;
    background: linear-gradient(var(--blue), var(--blue-dark));
    box-shadow: 0 3px 0 #24698F;
  }
  .btn-change { width: 96px; height: 42px; font-size: 22px; }
  .btn-wide   { width: 118px; height: 44px; font-size: 22px; }
  .right-align { justify-content: flex-end; width: 100%; padding-right: 84px; }

  /* 안내 문구 (원본에는 없는 추가 요소 -- 중복 키/저장 결과 피드백용) */
  .notice { min-height: 30px; font-size: 22px; color: #8A5A2A; padding-left: 168px; }

  /* 하단 버튼 */
  .footer { position: absolute; left: 44px; bottom: 56px; display: flex; gap: 24px; }
  .btn-apply { width: 258px; height: 88px; font-size: 32px; }
  .btn-close {
    width: 258px; height: 88px; font-size: 32px; color: var(--ink);
    background: linear-gradient(var(--khaki), #A8976A); box-shadow: 0 3px 0 #8C7C50;
  }
</style>

<div class="stage" id="stage">
  <div class="world">
    <div class="sky"></div><div class="hills"></div><div class="grass"></div>
    <div class="water"></div><div class="stone"></div>
  </div>
  <div class="hud-right"><span>&#128101;</span><span>&#8943;</span></div>

  <div class="panel">
    <h1>설정</h1>

    <section>
      <h2>사운드</h2>
      <div class="row">
        <div class="label">BGM</div>
        <div class="track"><div class="handle" style="left:50%"></div></div>
        <div class="valuebox">50</div>
      </div>
      <div class="row">
        <div class="label">효과음</div>
        <div class="track"><div class="handle" style="left:50%"></div></div>
        <div class="valuebox">50</div>
      </div>
    </section>

    <section>
      <h2>키 설정</h2>
      <div class="row">
        <div class="label">1번 입력</div>
        <div class="waiticon"></div>
        <div class="keybox">&#8592;</div>
        <button class="btn-change">변경</button>
      </div>
      <div class="row">
        <div class="label">2번 입력</div>
        <div class="waiticon"></div>
        <div class="keybox">&#8594;</div>
        <button class="btn-change">변경</button>
      </div>
      <div class="row">
        <div class="label">확인</div>
        <div class="waiticon">&#9658;</div>
        <div class="keybox waiting">입력 대기</div>
        <button class="btn-change">변경</button>
      </div>
      <div class="row right-align"><button class="btn-wide">되돌리기</button></div>
      <div class="notice">변경할 키를 누르세요. (ESC: 취소)</div>
    </section>

    <section>
      <h2>싱크 조절</h2>
      <div class="row">
        <div class="label">현재 싱크</div>
        <div class="valuebox">0ms</div>
        <button class="btn-wide">조절하기</button>
      </div>
    </section>

    <div class="footer">
      <button class="btn-apply">적용하기</button>
      <button class="btn-close">닫기</button>
    </div>
  </div>
</div>

<script>
  // 브라우저 창 크기에 맞춰 1920x1080 무대를 통째로 축소한다.
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    const stage = document.getElementById('stage');
    stage.style.transform = 'scale(' + s + ')';
    document.body.style.height = (1080 * s) + 'px';
  }
  addEventListener('resize', fit); fit();
</script>
